name: Agente Buscador de Licitaciones

"on":
  schedule:
    # Lunes a viernes a las 12:00 UTC
    # = 09:00 en Chile cuando Chile está en UTC-3
    - cron: "0 12 * * 1-5"

  # Permite ejecutar el workflow manualmente
  workflow_dispatch: {}

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar agente buscador
        env:
          MERCADO_PUBLICO_TICKET: ${{ secrets.MERCADO_PUBLICO_TICKET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python buscador_licitaciones.py
